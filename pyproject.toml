[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-learning-lab"
version = "0.1.0"
description = "An example-first path through basic ML, pretrained models, and RAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
pretrained = ["transformers>=4.44,<5", "torch>=2.3"]
rag = ["sentence-transformers>=3,<6", "transformers>=4.44,<5", "torch>=2.3"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
